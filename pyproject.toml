# yaml-language-server: $schema=https://json.schemastore.org/pyproject.json
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "testing-python"
version = "0.0.0"
description = "Testing stuff with Python."
authors = [{name = "billwallis"}]
maintainers = [{name = "billwallis"}]
readme = "README.md"
urls.Homepage = "https://github.com/billwallis/testing-python"
urls.Repository = "https://github.com/billwallis/testing-python"
urls.Issues = "https://github.com/billwallis/testing-python/issues"
urls.Documentation = "https://github.com/billwallis/testing-python/blob/main/README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dynamic = ["dependencies"]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
]
test = [
    "covdefaults>=2.3.0",
    "coverage>=7.16.0",
    "pytest>=9.1.1",
]


# For some reason, setuptools doesn't like the editable syntax :sob:
#[tool.setuptools.dynamic]
#dependencies = {file = ["requirements.txt"]}


[tool.pytest.ini_options]
testpaths = ["projects/*/tests"]


[tool.coverage]
run.source = [
    "projects/document_formats/src/",
    "projects/document_formats/tests/",
    "projects/duckdb_parsing/src/",
    "projects/duckdb_parsing/tests/",
    "projects/rich_cli/src/",
    "projects/rich_cli/tests/",
    "projects/testing_async/src/",
    "projects/testing_async/tests/",
    "projects/testing_avro/src/",
    "projects/testing_avro/tests/",
    "projects/testing_cython/src/",
    "projects/testing_cython/tests/",
    "projects/testing_dbml/src/",
    "projects/testing_dbml/tests/",
    "projects/testing_duckdb_quack/src/",
    "projects/testing_duckdb_quack/tests/",
    "projects/testing_jinja/src/",
    "projects/testing_jinja/tests/",
    "projects/testing_loading_bar/src/",
    "projects/testing_loading_bar/tests/",
    "projects/testing_nocodb/src/",
    "projects/testing_nocodb/tests/",
    "projects/testing_orc/src/",
    "projects/testing_orc/tests/",
    "projects/testing_redis/src/",
    "projects/testing_redis/tests/",
    "projects/testing_sqlglot/src/",
    "projects/testing_sqlglot/tests/",
    "projects/testing_struct/src/",
    "projects/testing_struct/tests/",
    "projects/yaml_parsing/src/",
    "projects/yaml_parsing/tests/",
]
run.plugins = ["covdefaults"]  # https://youtu.be/70T6OxKwxm0
report.fail_under = 10
report.exclude_lines = [
    "@pytest.mark.skip",
    "@pytest.mark.xfail",
]


[tool.poe]
verbosity = -1
envfile.optional = ".env"

[tool.poe.tasks]
install.shell = """
    pip install \
      --editable . \
      --requirement requirements.txt \
      --group dev \
      --group test \
      --force-reinstall
    pre-commit install --install-hooks
"""
test.shell = """
    coverage erase
    coverage run -m pytest -vvv
    coverage xml --quiet
    coverage report --no-skip-covered --include 'projects/*/tests/*' --fail-under 100
    coverage report --no-skip-covered --include 'projects/*/src/*'
"""

[tool.poe.tasks.lint]
control.expr = "sys.platform"

[[tool.poe.tasks.lint.switch]]
case = "win32"
shell = """
    echo '=== pre-commit checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '=== pre-push checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""

[[tool.poe.tasks.lint.switch]]
shell = """
    echo '\\033[0;34mpre-commit checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '\\033[0;34mpre-push checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""
